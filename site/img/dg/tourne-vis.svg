<svg class="tourne-vis-svg dg-svg" viewBox="0 0 800 320" role="img" aria-label="Diagram"><style>.tourne-vis-svg .lab{font:12.5px var(--label,sans-serif);fill:var(--muted,#5a6275)}.tourne-vis-svg .lb{fill:var(--ink,#1c1f26);font-weight:600}.tourne-vis-svg .ttl{font:14px var(--label,sans-serif);fill:var(--bleu,#1f3a78);letter-spacing:.04em}.tourne-vis-svg .ld{stroke:var(--muted,#5a6275);stroke-width:1;fill:none}.tourne-vis-svg .dot{fill:var(--ecarlate,#b3261e)}.tourne-vis-svg .st{fill:none;stroke:#8d7a5c;stroke-width:.9;stroke-dasharray:3 2.4}.tourne-vis-svg .dim{stroke:var(--ecarlate,#b3261e);stroke-width:1.1;fill:none}.tourne-vis-svg .dimt{font:12px var(--label,sans-serif);fill:var(--ecarlate,#b3261e)}</style><text class="ttl l-ca" x="400" y="26" text-anchor="middle">Tornavís de soldat (esquema, no a escala)</text><text class="ttl l-en" x="400" y="26" text-anchor="middle">Soldier's turnscrew (diagram, not to scale)</text><text class="ttl l-it" x="400" y="26" text-anchor="middle">Cacciavite del soldato (schema, non in scala)</text><text class="ttl l-fr" x="400" y="26" text-anchor="middle">Tourne-vis du soldat (schéma, pas à l'échelle)</text><text class="ttl l-de" x="400" y="26" text-anchor="middle">Schraubenzieher des Soldaten (Schema, nicht maßstäblich)</text><defs>
