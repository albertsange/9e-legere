<svg class="dragonne-svg dg-svg" viewBox="0 0 800 420" role="img" aria-label="Diagram"><style>.dragonne-svg .lab{font:12.5px var(--label,sans-serif);fill:var(--muted,#5a6275)}.dragonne-svg .lb{fill:var(--ink,#1c1f26);font-weight:600}.dragonne-svg .ttl{font:14px var(--label,sans-serif);fill:var(--bleu,#1f3a78);letter-spacing:.04em}.dragonne-svg .ld{stroke:var(--muted,#5a6275);stroke-width:1;fill:none}.dragonne-svg .dot{fill:var(--ecarlate,#b3261e)}.dragonne-svg .st{fill:none;stroke:#8d7a5c;stroke-width:.9;stroke-dasharray:3 2.4}.dragonne-svg .dim{stroke:var(--ecarlate,#b3261e);stroke-width:1.1;fill:none}.dragonne-svg .dimt{font:12px var(--label,sans-serif);fill:var(--ecarlate,#b3261e)}</style><text class="ttl l-ca" x="400" y="26" text-anchor="middle">Dragona de tropa (esquema, no a escala)</text><text class="ttl l-en" x="400" y="26" text-anchor="middle">Rank-and-file sword knot (diagram, not to scale)</text><text class="ttl l-it" x="400" y="26" text-anchor="middle">Dragona di truppa (schema, non in scala)</text><text class="ttl l-fr" x="400" y="26" text-anchor="middle">Dragonne de troupe (schéma, pas à l'échelle)</text><text class="ttl l-de" x="400" y="26" text-anchor="middle">Faustriemen der Mannschaft (Schema, nicht maßstäblich)</text><defs>
