<linearGradient id="mouchoirs-buff" x1="0" x2="1"><stop offset="0" stop-color="#e9e4d6"/><stop offset=".5" stop-color="#fbf9f2"/><stop offset="1" stop-color="#e2dccb"/></linearGradient>
<linearGradient id="mouchoirs-green" x1="0" x2="1"><stop offset="0" stop-color="#1e4f2a"/><stop offset=".5" stop-color="#2f7a3b"/><stop offset="1" stop-color="#1c4826"/></linearGradient>
