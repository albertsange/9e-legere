<linearGradient id="mouchoirs-steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef0f2"/><stop offset=".5" stop-color="#a9afb6"/><stop offset="1" stop-color="#6c727a"/></linearGradient>
<linearGradient id="mouchoirs-wood" x1="0" x2="1"><stop offset="0" stop-color="#6b4424"/><stop offset=".5" stop-color="#9a6638"/><stop offset="1" stop-color="#5e3a1e"/></linearGradient>
