</defs><path d="M300 120 L500 120 L500 300 L300 300 Z" fill="#efe9d8" stroke="#a49c86"/><path d="M300 120 L500 300 M500 120 L300 300" stroke="#d6cdb4" stroke-dasharray="4 4"/><path d="M310 130 L490 130 L490 290 L310 290 Z" fill="none" stroke="#c9bfa4" stroke-width="1"/><path d="M320 320 L480 320 L480 350 L320 350 Z" fill="#e6dfca" stroke="#a49c86"/><path class="ld" d="M270 196 L300 200"/><circle class="dot" cx="300" cy="200" r="2.6"/><text class="lab l-ca" x="262" y="200" text-anchor="end"><tspan class="lb">Material, color i mida</tspan><tspan x="262" dy="15">pendents d'evidències</tspan></text><text class="lab l-en" x="262" y="200" text-anchor="end"><tspan class="lb">Material, colour and size</tspan><tspan x="262" dy="15">awaiting evidence</tspan></text><text class="lab l-it" x="262" y="200" text-anchor="end"><tspan class="lb">Materiale, colore e misura</tspan><tspan x="262" dy="15">in attesa di prove</tspan></text><text class="lab l-fr" x="262" y="200" text-anchor="end"><tspan class="lb">Matière, couleur et taille</tspan><tspan x="262" dy="15">en attente de preuves</tspan></text><text class="lab l-de" x="262" y="200" text-anchor="end"><tspan class="lb">Material, Farbe und Größe</tspan><tspan x="262" dy="15">Belege ausstehend</tspan></text><path class="ld" d="M540 332 L480 336"/><circle class="dot" cx="480" cy="336" r="2.6"/><text class="lab l-ca" x="548" y="336" text-anchor="start"><tspan class="lb">Dos per soldat</tspan><tspan x="548" dy="15">a la motxilla</tspan></text><text class="lab l-en" x="548" y="336" text-anchor="start"><tspan class="lb">Two per soldier</tspan><tspan x="548" dy="15">in the knapsack</tspan></text><text class="lab l-it" x="548" y="336" text-anchor="start"><tspan class="lb">Due per soldato</tspan><tspan x="548" dy="15">nello zaino</tspan></text><text class="lab l-fr" x="548" y="336" text-anchor="start"><tspan class="lb">Deux par soldat</tspan><tspan x="548" dy="15">dans le havresac</tspan></text><text class="lab l-de" x="548" y="336" text-anchor="start"><tspan class="lb">Zwei je Soldat</tspan><tspan x="548" dy="15">im Tornister</tspan></text></svg>