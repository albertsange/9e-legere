<svg class="alene-svg dg-svg" viewBox="0 0 800 300" role="img" aria-label="Diagram"><style>.alene-svg .lab{font:12.5px var(--label,sans-serif);fill:var(--muted,#5a6275)}.alene-svg .lb{fill:var(--ink,#1c1f26);font-weight:600}.alene-svg .ttl{font:14px var(--label,sans-serif);fill:var(--bleu,#1f3a78);letter-spacing:.04em}.alene-svg .ld{stroke:var(--muted,#5a6275);stroke-width:1;fill:none}.alene-svg .dot{fill:var(--ecarlate,#b3261e)}.alene-svg .st{fill:none;stroke:#8d7a5c;stroke-width:.9;stroke-dasharray:3 2.4}.alene-svg .dim{stroke:var(--ecarlate,#b3261e);stroke-width:1.1;fill:none}.alene-svg .dimt{font:12px var(--label,sans-serif);fill:var(--ecarlate,#b3261e)}</style><text class="ttl l-ca" x="400" y="26" text-anchor="middle">Alena (esquema, no a escala)</text><text class="ttl l-en" x="400" y="26" text-anchor="middle">Awl (diagram, not to scale)</text><text class="ttl l-it" x="400" y="26" text-anchor="middle">Lesina (schema, non in scala)</text><text class="ttl l-fr" x="400" y="26" text-anchor="middle">Alêne (schéma, pas à l'échelle)</text><text class="ttl l-de" x="400" y="26" text-anchor="middle">Ahle (Schema, nicht maßstäblich)</text><defs>
<linearGradient id="alene-brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3d77a"/><stop offset=".5" stop-color="#c9a13a"/><stop offset="1" stop-color="#8e6c1c"/></linearGradient>
