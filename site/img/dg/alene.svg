</defs><path d="M300 160 Q300 140 330 140 L380 146 L380 174 L330 180 Q300 180 300 160 Z" fill="url(#alene-wood)" stroke="#3f2612"/><rect x="380" y="150" width="12" height="20" fill="url(#alene-steel)" stroke="#5c626b"/><path d="M392 156 L520 160 L392 164 Z" fill="url(#alene-steel)" stroke="#5c626b"/><path class="ld" d="M270 160 L300 160"/><circle class="dot" cx="300" cy="160" r="2.6"/><text class="lab l-ca" x="262" y="164" text-anchor="end"><tspan class="lb">Mànec</tspan><tspan x="262" dy="15">fusta</tspan></text><text class="lab l-en" x="262" y="164" text-anchor="end"><tspan class="lb">Handle</tspan><tspan x="262" dy="15">wood</tspan></text><text class="lab l-it" x="262" y="164" text-anchor="end"><tspan class="lb">Manico</tspan><tspan x="262" dy="15">legno</tspan></text><text class="lab l-fr" x="262" y="164" text-anchor="end"><tspan class="lb">Manche</tspan><tspan x="262" dy="15">bois</tspan></text><text class="lab l-de" x="262" y="164" text-anchor="end"><tspan class="lb">Griff</tspan><tspan x="262" dy="15">Holz</tspan></text><path class="ld" d="M540 116 L480 160"/><circle class="dot" cx="480" cy="160" r="2.6"/><text class="lab l-ca" x="548" y="120" text-anchor="start"><tspan class="lb">Punta</tspan><tspan x="548" dy="15">per foradar i cosir el cuir</tspan></text><text class="lab l-en" x="548" y="120" text-anchor="start"><tspan class="lb">Point</tspan><tspan x="548" dy="15">to pierce and sew leather</tspan></text><text class="lab l-it" x="548" y="120" text-anchor="start"><tspan class="lb">Punta</tspan><tspan x="548" dy="15">per forare e cucire il cuoio</tspan></text><text class="lab l-fr" x="548" y="120" text-anchor="start"><tspan class="lb">Pointe</tspan><tspan x="548" dy="15">pour percer et coudre le cuir</tspan></text><text class="lab l-de" x="548" y="120" text-anchor="start"><tspan class="lb">Spitze</tspan><tspan x="548" dy="15">zum Stechen und Nähen von Leder</tspan></text></svg>