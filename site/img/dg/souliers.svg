a)</tspan></text><text class="lab l-fr" x="548" y="180" text-anchor="start"><tspan class="lb">Attache</tspan><tspan x="548" dy="15">cordons (sans boucle)</tspan></text><text class="lab l-de" x="548" y="180" text-anchor="start"><tspan class="lb">Verschluss</tspan><tspan x="548" dy="15">Schnüre (ohne Schnalle)</tspan></text><path class="ld" d="M270 356 L300 322"/><circle class="dot" cx="300" cy="322" r="2.6"/><text class="lab l-ca" x="262" y="360" text-anchor="end"><tspan class="lb">Soles</tspan><tspan x="262" dy="15">cuir fort, amb sola intermèdia</tspan></text><text class="lab l-en" x="262" y="360" text-anchor="end"><tspan class="lb">Soles</tspan><tspan x="262" dy="15">strong leather, with middle sole</tspan></text><text class="lab l-it" x="262" y="360" text-anchor="end"><tspan class="lb">Suole</tspan><tspan x="262" dy="15">cuoio forte, con suola intermedia</tspan></text><text class="lab l-fr" x="262" y="360" text-anchor="end"><tspan class="lb">Semelles</tspan><tspan x="262" dy="15">cuir fort, semelle intermédiaire</tspan></text><text class="lab l-de" x="262" y="360" text-anchor="end"><tspan class="lb">Sohlen</tspan><tspan x="262" dy="15">starkes Leder, mit Zwischensohle</tspan></text><path class="ld" d="M540 246 L436 324"/><circle class="dot" cx="436" cy="324" r="2.6"/><text class="lab l-ca" x="548" y="250" text-anchor="start"><tspan class="lb">Claus</tspan><tspan x="548" dy="15">cap rodó, a les vores i al taló</tspan></text><text class="lab l-en" x="548" y="250" text-anchor="start"><tspan class="lb">Nails</tspan><tspan x="548" dy="15">round heads, at edges and heel</tspan></text><text class="lab l-it" x="548" y="250" text-anchor="start"><tspan class="lb">Chiodi</tspan><tspan x="548" dy="15">testa tonda, ai bordi e al tacco</tspan></text><text class="lab l-fr" x="548" y="250" text-anchor="start"><tspan class="lb">Clous</tspan><tspan x="548" dy="15">tête ronde, bords et talon</tspan></text><text class="lab l-de" x="548" y="250" text-anchor="start"><tspan class="lb">