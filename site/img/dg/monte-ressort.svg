<svg class="monte-ressort-svg dg-svg" viewBox="0 0 800 300" role="img" aria-label="Diagram"><style>.monte-ressort-svg .lab{font:12.5px var(--label,sans-serif);fill:var(--muted,#5a6275)}.monte-ressort-svg .lb{fill:var(--ink,#1c1f26);font-weight:600}.monte-ressort-svg .ttl{font:14px var(--label,sans-serif);fill:var(--bleu,#1f3a78);letter-spacing:.04em}.monte-ressort-svg .ld{stroke:var(--muted,#5a6275);stroke-width:1;fill:none}.monte-ressort-svg .dot{fill:var(--ecarlate,#b3261e)}.monte-ressort-svg .st{fill:none;stroke:#8d7a5c;stroke-width:.9;stroke-dasharray:3 2.4}.monte-ressort-svg .dim{stroke:var(--ecarlate,#b3261e);stroke-width:1.1;fill:none}.monte-ressort-svg .dimt{font:12px var(--label,sans-serif);fill:var(--ecarlate,#b3261e)}</style><text class="ttl l-ca" x="400" y="26" text-anchor="middle">Monte-ressort (esquema, no a escala)</text><text class="ttl l-en" x="400" y="26" text-anchor="middle">Mainspring vice (diagram, not to scale)</text><text class="ttl l-it" x="400" y="26" text-anchor="middle">Montamolle (schema, non in scala)</text><text class="ttl l-fr" x="400" y="26" text-anchor="middle">Monte-ressort (schéma, pas à l'échelle)</text><text class="ttl l-de" x="400" y="26" text-anchor="middle">Federspanner (Schema, nicht maßstäblich)</text><defs>
