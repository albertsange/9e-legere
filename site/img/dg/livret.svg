<svg class="livret-svg dg-svg" viewBox="0 0 800 340" role="img" aria-label="Diagram"><style>.livret-svg .lab{font:12.5px var(--label,sans-serif);fill:var(--muted,#5a6275)}.livret-svg .lb{fill:var(--ink,#1c1f26);font-weight:600}.livret-svg .ttl{font:14px var(--label,sans-serif);fill:var(--bleu,#1f3a78);letter-spacing:.04em}.livret-svg .ld{stroke:var(--muted,#5a6275);stroke-width:1;fill:none}.livret-svg .dot{fill:var(--ecarlate,#b3261e)}.livret-svg .st{fill:none;stroke:#8d7a5c;stroke-width:.9;stroke-dasharray:3 2.4}.livret-svg .dim{stroke:var(--ecarlate,#b3261e);stroke-width:1.1;fill:none}.livret-svg .dimt{font:12px var(--label,sans-serif);fill:var(--ecarlate,#b3261e)}</style><text class="ttl l-ca" x="400" y="26" text-anchor="middle">Llibreta de comptes (esquema, no a escala)</text><text class="ttl l-en" x="400" y="26" text-anchor="middle">Pay book (diagram, not to scale)</text><text class="ttl l-it" x="400" y="26" text-anchor="middle">Libretto dei conti (schema, non in scala)</text><text class="ttl l-fr" x="400" y="26" text-anchor="middle">Livret de compte (schéma, pas à l'échelle)</text><text class="ttl l-de" x="400" y="26" text-anchor="middle">Soldbuch (Schema, nicht maßstäblich)</text><defs>
