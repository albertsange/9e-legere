lass="lab l-ca" x="548" y="230" text-anchor="start"><tspan class="lb">Doble espiral</tspan><tspan x="548" dy="15">treu càrrega, taco i brutícia</tspan></text><text class="lab l-en" x="548" y="230" text-anchor="start"><tspan class="lb">Double worm</tspan><tspan x="548" dy="15">draws charge, wad and dirt</tspan></text><text class="lab l-it" x="548" y="230" text-anchor="start"><tspan class="lb">Doppia spirale</tspan><tspan x="548" dy="15">toglie carica, stoppaccio e sporco</tspan></text><text class="lab l-fr" x="548" y="230" text-anchor="start"><tspan class="lb">Double spirale</tspan><tspan x="548" dy="15">retire charge, bourre et crasse</tspan></text><text class="lab l-de" x="548" y="230" text-anchor="start"><tspan class="lb">Doppelspirale</tspan><tspan x="548" dy="15">entfernt Ladung, Pfropfen und Schmutz</tspan></text></svg>