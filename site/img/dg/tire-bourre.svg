<svg class="tire-bourre-svg dg-svg" viewBox="0 0 800 300" role="img" aria-label="Diagram"><style>.tire-bourre-svg .lab{font:12.5px var(--label,sans-serif);fill:var(--muted,#5a6275)}.tire-bourre-svg .lb{fill:var(--ink,#1c1f26);font-weight:600}.tire-bourre-svg .ttl{font:14px var(--label,sans-serif);fill:var(--bleu,#1f3a78);letter-spacing:.04em}.tire-bourre-svg .ld{stroke:var(--muted,#5a6275);stroke-width:1;fill:none}.tire-bourre-svg .dot{fill:var(--ecarlate,#b3261e)}.tire-bourre-svg .st{fill:none;stroke:#8d7a5c;stroke-width:.9;stroke-dasharray:3 2.4}.tire-bourre-svg .dim{stroke:var(--ecarlate,#b3261e);stroke-width:1.1;fill:none}.tire-bourre-svg .dimt{font:12px var(--label,sans-serif);fill:var(--ecarlate,#b3261e)}</style><text class="ttl l-ca" x="400" y="26" text-anchor="middle">Tire-bourre a la baqueta (esquema, no a escala)</text><text class="ttl l-en" x="400" y="26" text-anchor="middle">Worm on the ramrod (diagram, not to scale)</text><text class="ttl l-it" x="400" y="26" text-anchor="middle">Cavastracci sulla bacchetta (schema, non in scala)</text><text class="ttl l-fr" x="400" y="26" text-anchor="middle">Tire-bourre sur la baguette (schéma, pas à l'échelle)</text><text class="ttl l-de" x="400" y="26" text-anchor="middle">Krätzer am Ladestock (Schema, nicht maßstäblich)</text><defs>
