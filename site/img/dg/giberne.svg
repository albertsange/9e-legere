<svg class="giberne-svg dg-svg" viewBox="0 0 800 420" role="img" aria-label="Diagram"><style>.giberne-svg .lab{font:12.5px var(--label,sans-serif);fill:var(--muted,#5a6275)}.giberne-svg .lb{fill:var(--ink,#1c1f26);font-weight:600}.giberne-svg .ttl{font:14px var(--label,sans-serif);fill:var(--bleu,#1f3a78);letter-spacing:.04em}.giberne-svg .ld{stroke:var(--muted,#5a6275);stroke-width:1;fill:none}.giberne-svg .dot{fill:var(--ecarlate,#b3261e)}.giberne-svg .st{fill:none;stroke:#8d7a5c;stroke-width:.9;stroke-dasharray:3 2.4}.giberne-svg .dim{stroke:var(--ecarlate,#b3261e);stroke-width:1.1;fill:none}.giberne-svg .dimt{font:12px var(--label,sans-serif);fill:var(--ecarlate,#b3261e)}</style><text class="ttl l-ca" x="400" y="26" text-anchor="middle">Giberna (vista de davant, solapa tancada) (esquema, no a escala)</text><text class="ttl l-en" x="400" y="26" text-anchor="middle">Cartridge box (front, flap closed) (diagram, not to scale)</text><text class="ttl l-it" x="400" y="26" text-anchor="middle">Giberna (davanti, patta chiusa) (schema, non in scala)</text><text class="ttl l-fr" x="400" y="26" text-anchor="middle">Giberne (de face, pattelette fermée) (schéma, pas à l'échelle)</text><text class="ttl l-de" x="400" y="26" text-anchor="middle">Patronentasche (vorne, Deckel geschlossen) (Schema, nicht maßstäblich)</text><defs>
