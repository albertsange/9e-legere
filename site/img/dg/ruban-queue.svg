<svg class="ruban-queue-svg dg-svg" viewBox="0 0 800 340" role="img" aria-label="Diagram"><style>.ruban-queue-svg .lab{font:12.5px var(--label,sans-serif);fill:var(--muted,#5a6275)}.ruban-queue-svg .lb{fill:var(--ink,#1c1f26);font-weight:600}.ruban-queue-svg .ttl{font:14px var(--label,sans-serif);fill:var(--bleu,#1f3a78);letter-spacing:.04em}.ruban-queue-svg .ld{stroke:var(--muted,#5a6275);stroke-width:1;fill:none}.ruban-queue-svg .dot{fill:var(--ecarlate,#b3261e)}.ruban-queue-svg .st{fill:none;stroke:#8d7a5c;stroke-width:.9;stroke-dasharray:3 2.4}.ruban-queue-svg .dim{stroke:var(--ecarlate,#b3261e);stroke-width:1.1;fill:none}.ruban-queue-svg .dimt{font:12px var(--label,sans-serif);fill:var(--ecarlate,#b3261e)}</style><text class="ttl l-ca" x="400" y="26" text-anchor="middle">Cinta de la cua (esquema, no a escala)</text><text class="ttl l-en" x="400" y="26" text-anchor="middle">Queue ribbon (diagram, not to scale)</text><text class="ttl l-it" x="400" y="26" text-anchor="middle">Nastro del codino (schema, non in scala)</text><text class="ttl l-fr" x="400" y="26" text-anchor="middle">Ruban de queue (schéma, pas à l'échelle)</text><text class="ttl l-de" x="400" y="26" text-anchor="middle">Zopfband (Schema, nicht maßstäblich)</text><defs>
<linearGradient id="ruban-queue-brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3d77a"/><stop offset=".5" stop-color="#c9a13a"/><stop offset="1" stop-color="#8e6c1c"/></linearGradient>
